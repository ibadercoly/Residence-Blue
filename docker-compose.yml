services:
  postgres:
    image: postgres:16-alpine
    container_name: residence_blue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blue_user
      POSTGRES_PASSWORD: blue_password
      POSTGRES_DB: residence_blue_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blue_user -d residence_blue_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: residence_blue_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://blue_user:blue_password@postgres:5432/residence_blue_db?schema=public
      ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: super_secret_jwt_residence_blue_dev_key_only_change_in_prod
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: residence_blue_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  pgdata:
    driver: local
