services:
  db:
    image: postgres:16-alpine
    container_name: residence_blue_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
    command:
      - "postgres"
      - "-c"
      - "password_encryption=scram-sha-256"
    # SÉCURITÉ : Aucun port publié vers l'hôte (pas de section "ports:").
    # Seul le service "api" (avec app_user) et le conteneur "backup" accèdent à "db" via "internal_net".
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: residence_blue_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      # L'API tourne exclusivement avec le rôle app_user (aucun DDL, pas superuser)
      DATABASE_URL: postgresql://${APP_USER:-app_user}:${APP_USER_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      MIGRATION_DATABASE_URL: postgresql://${APP_OWNER:-app_owner}:${APP_OWNER_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-v1}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - internal_net
      - public_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: residence_blue_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4200:80"
    networks:
      - public_net

  backup:
    image: postgres:16-alpine
    container_name: residence_blue_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${APP_OWNER:-app_owner}
      PGPASSWORD: ${APP_OWNER_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
    volumes:
      - ./scripts:/scripts:ro
      - pgbackups:/backups
    networks:
      - internal_net
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        apk add --no-cache gnupg age >/dev/null 2>&1 || true
        echo "0 2 * * * /bin/sh /scripts/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        crond -f -l 8

networks:
  internal_net:
    driver: bridge
    internal: true
  public_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  pgbackups:
    driver: local
