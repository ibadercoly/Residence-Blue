services:
  db:
    image: postgres:16-alpine
    container_name: residence_blue_db
    restart: unless-stopped
    # Seules les variables nécessaires sont transmises (pas de env_file global)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?APP_OWNER_PASSWORD requis}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?APP_USER_PASSWORD requis}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD:?APP_READONLY_PASSWORD requis}
    command:
      - "postgres"
      - "-c"
      - "password_encryption=scram-sha-256"
    # SÉCURITÉ : Aucun port publié vers l'hôte (pas de section "ports:").
    # Seuls "migrate", "api" et "backup" accèdent à "db" via le réseau interne "internal_net".
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/00-init-roles.sh:/docker-entrypoint-initdb.d/00-init-roles.sh:ro
      - ./docker/postgres/init.sql:/opt/residence-blue/init.sql:ro
    networks:
      - internal_net
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applique les migrations Prisma avec app_owner, puis s'arrête
  migrate:
    image: residence-blue-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: residence_blue_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_owner:${APP_OWNER_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - internal_net

  api:
    image: residence-blue-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: residence_blue_api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # L'API tourne exclusivement avec le rôle app_user (aucun DDL, pas superuser)
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-v1}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY requis}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      MEDIA_DIR: /app/uploads/rooms
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - media_uploads:/app/uploads/rooms
    networks:
      - internal_net
      - public_net
    mem_limit: 300m
    deploy:
      resources:
        limits:
          memory: 300M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: residence_blue_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4200:80"
    networks:
      - public_net

  # Sauvegarde chiffrée quotidienne (02h00 UTC) — réseau interne uniquement
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    container_name: residence_blue_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: app_owner
      PGPASSWORD: ${APP_OWNER_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY requis}
    volumes:
      - ./scripts:/scripts:ro
      - pgbackups:/backups
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge
    internal: true
  public_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  pgbackups:
    driver: local
  media_uploads:
    driver: local
