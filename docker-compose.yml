services:
  db:
    image: postgres:16-alpine
    container_name: residence_blue_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # SÉCURITÉ : Aucun port publié vers l'hôte (pas de section "ports:").
    # Seul le service "api" accède à "db" via le réseau interne "internal_net".
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: residence_blue_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - internal_net
      - public_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: residence_blue_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4200:80"
    networks:
      - public_net

networks:
  internal_net:
    driver: bridge
    internal: true
  public_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
