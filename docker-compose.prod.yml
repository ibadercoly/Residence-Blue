services:
  db:
    image: postgres:16-alpine
    container_name: residence_blue_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?APP_OWNER_PASSWORD requis}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?APP_USER_PASSWORD requis}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD:?APP_READONLY_PASSWORD requis}
    command:
      - "postgres"
      - "-c"
      - "password_encryption=scram-sha-256"
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/00-init-roles.sh:/docker-entrypoint-initdb.d/00-init-roles.sh:ro
      - ./docker/postgres/init.sql:/opt/residence-blue/init.sql:ro
    networks:
      - internal_net
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: residence-blue-api:prod
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: residence_blue_prod_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_owner:${APP_OWNER_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - internal_net

  api:
    image: residence-blue-api:prod
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: residence_blue_prod_api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-v1}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY requis}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${HTTPS_DOMAIN:-localhost}}
      MEDIA_DIR: ${MEDIA_DIR:-/app/uploads/rooms}
    expose:
      - "3000"
    volumes:
      # Volume persistant pour préserver les images téléversées à chaque reconstruction
      - media_uploads:/app/uploads/rooms
    networks:
      - internal_net
      - public_net
    mem_limit: 300m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: residence_blue_prod_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - public_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: caddy:2-alpine
    container_name: residence_blue_prod_proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      HTTPS_DOMAIN: ${HTTPS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public_net

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    container_name: residence_blue_prod_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: app_owner
      PGPASSWORD: ${APP_OWNER_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-/backups-offsite}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY requis}
    volumes:
      - ./scripts:/scripts:ro
      - pgbackups:/backups
      - pgbackups_offsite:/backups-offsite
      # Inclusion des images dans les sauvegardes
      - media_uploads:/backups/media:ro
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge
    internal: true
  public_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  pgbackups:
    driver: local
  pgbackups_offsite:
    driver: local
  media_uploads:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
